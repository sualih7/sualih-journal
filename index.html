<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sualih Journal</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0a0f;color:#e0e0e0;margin:0;padding:20px}
h1{color:#00d4ff;margin-bottom:20px}
.stats{display:flex;gap:15px;margin-bottom:20px}
.stat{background:#111827;padding:15px;border-radius:8px;text-align:center}
.stat-value{font-size:1.4rem;color:#00d4ff}
.stat-label{font-size:0.8rem;color:#888}
button{background:#00d4ff;color:#000;border:none;padding:8px 12px;border-radius:4px;margin:5px;cursor:pointer}
button:hover{opacity:0.9}
#addModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000}
#addModal.active{display:flex}
.modal-content{background:#111827;border-radius:8px;padding:20px;width:90%;max-width:400px}
.close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#ff4757}
input,select,textarea{width:100%;padding:8px;margin-top:8px}
.table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border:1px solid #1e1e22;text-align:left}
th{background:#0f172a;color:#00d4ff}
</style>
</head>
<body>
<h1>🪙 Sualih Journal</h1>
<div class="stats">
  <div class="stat"><div class="stat-value" id="bal">$200</div><div class="stat-label">Balance</div></div>
  <div class="stat"><div class="stat-value" id="pl">0</div><div class="stat-label">P&L</div></div>
  <div class="stat"><div class="stat-value" id="trades">0</div><div class="stat-label">Trades</div></div>
</div>
<button onclick="openModal()">➕ Add Entry</button>
<button onclick="exportCSV()">📥 CSV</button>
<button onclick="exportJSON()">📋 JSON</button>

<div id="dropzone" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" style="border:2px dashed #00d4ff;border-radius:8px;padding:30px;text-align:center;color:#888;cursor:pointer;margin:20px 0">
  📂 Drop JSON/CSV File Here
  <input type="file" id="fileInput" style="display:none" accept=".json,.csv">
</div>

<table class="table">
<thead><tr><th>Date</th><th>Symbol</th><th>Direction</th><th>Entry</th><th>SL</th><th>TP</th><th>Size</th><th>P&L</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<div id="addModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">×</span>
<h2>Add Trade</h2>
<input type="datetime-local" id="date" required><br>
<input type="text" id="symbol" placeholder="Symbol"><br>
<select id="direction"><option value="1">Buy</option><option value="-1">Sell</option></select><br>
<input type="number" step="0.01" id="entry" placeholder="Entry" required><br>
<input type="number" step="0.01" id="sl" placeholder="Stop Loss" required><br>
<input type="number" step="0.01" id="tp" placeholder="Take Profit" required><br>
<input type="number" step="0.01" id="size" placeholder="Size" value="1"><br>
<textarea id="notes" placeholder="Notes"></textarea><br>
<button onclick="saveTrade()">Save</button>
</div>
</div>

<script>
let trades = JSON.parse(localStorage.getItem('sualih-trades') || '[]');
const BAL = 200;

function formatDate(ts){return new Date(Number(ts)).toLocaleString();}

function calculatePnl(d, e, s, tp){
  const risk = Math.abs(e - s);
  const reward = Math.abs(tp - e);
  return d == 1 ? (tp - e) * s : (e - tp) * s;
}

function render(){
  let pnl = 0;
  trades.forEach(t => {pnl += calculatePnl(t.direction, t.open_price, t.stop_loss, t.take_price) * t.size;});
  document.getElementById('bal').textContent = '$' + (BAL + pnl).toFixed(2);
  document.getElementById('pl').textContent = '+' + pnl.toFixed(2);
  document.getElementById('trades').textContent = trades.length;
  document.getElementById('tbody').innerHTML = trades.map((t, i) => {
    const p = calculatePnl(t.direction, t.open_price, t.stop_loss, t.take_price) * t.size;
    return '<tr style="animation:fadeIn .3s '+ (i*0.05) + 's">' +
      '<td>' + formatDate(t.time) + '</td>' +
      '<td>' + (t.symbol || 'XAUUSD') + '</td>' +
      '<td>' + (t.direction == 1 ? 'Buy' : 'Sell') + '</td>' +
      '<td>' + t.open_price + '</td>' +
      '<td>' + t.stop_loss + '</td>' +
      '<td>' + t.take_price + '</td>' +
      '<td>' + t.size + '</td>' +
      '<td>' + p.toFixed(2) + '</td></tr>';
  }).reverse().join('');
}

function openModal(){document.getElementById('addModal').classList.add('active');}
function closeModal(){document.getElementById('addModal').classList.remove('active');}

function saveTrade(){
  const t = {
    time: Date.parse(document.getElementById('date').value),
    symbol: document.getElementById('symbol').value,
    direction: parseInt(document.getElementById('direction').value),
    open_price: parseFloat(document.getElementById('entry').value),
    stop_loss: parseFloat(document.getElementById('sl').value),
    take_price: parseFloat(document.getElementById('tp').value),
    size: parseFloat(document.getElementById('size').value) || 1,
    notes: document.getElementById('notes').value
  };
  trades.push(t);
  localStorage.setItem('sualih-trades', JSON.stringify(trades));
  render();
  closeModal();
}

function handleDragOver(e){e.preventDefault(); document.getElementById('dropzone').style.borderColor = '#04c49c';}
function handleDragLeave(e){e.preventDefault(); document.getElementById('dropzone').style.borderColor = '#00d4ff';}
function handleDrop(e){
  e.preventDefault();
  document.getElementById('dropzone').style.borderColor = '#00d4ff';
  const f = e.dataTransfer.files[0];
  const reader = new FileReader();
  reader.onload = function(e2){
    let data;
    if(f.name.endsWith('.json')) data = JSON.parse(e2.target.result);
    else if(f.name.endsWith('.csv')) data = e2.target.result.trim().split('\n').slice(1).map(l => {
      const p = l.split(',');
      return {
        time: Date.parse(p[0]),
        symbol: p[1],
        direction: p[2] === 'Buy' ? 1 : -1,
        open_price: +p[3],
        stop_loss: +p[4],
        take_price: +p[5],
        size: +p[6] || 1,
        profit: +p[7] || 0
      };
    });
    data.forEach(t => trades.push(t));
    localStorage.setItem('sualih-trades', JSON.stringify(trades));
    render();
  };
  reader.readAsText(f);
}
function handleFile(f){
  const fr = new FileReader();
  fr.onload = function(e){
    let data;
    if(f.name.endsWith('.json')) data = JSON.parse(e.target.result);
    else if(f.name.endsWith('.csv')) {
      const lines = e.target.result.trim().split('\n').slice(1);
      data = lines.map(l => {
        const p = l.split(',');
        return {
          time: Date.parse(p[0]),
          symbol: p[1],
          direction: p[2] === 'Buy' ? 1 : -1,
          open_price: +p[3],
          stop_loss: +p[4],
          take_price: +p[5],
          size: +p[6] || 1,
          profit: +p[7] || 0
        };
      });
    }
    data.forEach(t => trades.push(t));
    localStorage.setItem('sualih-trades', JSON.stringify(trades));
    render();
  };
  fr.readAsText(f);
}

document.getElementById('dropzone').addEventListener('click', function() {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  if(e.target.files[0]) handleFile(e.target.files[0]);
});

function exportCSV(){
  const header = 'Date,Symbol,Direction,Entry,SL,TP,Size,P&L\n';
  const rows = trades.map(t => {
    const p = calculatePnl(t.direction, t.open_price, t.stop_loss, t.take_price) * t.size;
    return formatDate(t.time) + ',' + 
           (t.symbol || 'XAUUSD') + ',' +
           (t.direction == 1 ? 'Buy' : 'Sell') + ',' +
           t.open_price + ',' +
           t.stop_loss + ',' +
           t.take_price + ',' +
           t.size + ',' +
           p.toFixed(2);
  }).join('\n');
  const blob = new Blob([header + rows], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sualih-trades.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(trades, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sualih-trades.json';
  a.click();
  URL.revokeObjectURL(url);
}

window.onload = function(){
  render();
  const style = document.createElement('style');
  style.textContent = '@keyframes fadeIn {from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}';
  document.head.appendChild(style);
};
</script>
</body>
</html>
